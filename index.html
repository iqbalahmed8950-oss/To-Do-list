<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="TO DO.css">
</head>
<body>
    <div class="container">
        <h1>To Do List</h1>
        <div class="todo-input-area">
            <input type="text" id="task-input" placeholder="Enter a list">
            <button id="add-task-btn">Add into List</button>
        </div>
        <ol id="task-list"></ol>
        <p id="message"></p>
        <hr>
        <p id="list-count"></p>
    </div>
    <script src="ToDo list.js"></script>
</body>
</html>
